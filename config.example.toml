# ~/.config/agent-companion/config.toml
# Every key is optional; AGENT_COMPANION_<KEY> in the environment wins.

# The dashboard server
server_port = 8770
server_bind = "127.0.0.1"     # keep it on loopback; put `tailscale serve` in front for your phone

# What the page calls you
name = "you"

# What your install is called: page title, home screen, the phone app
app_name = "Companion"

# Pin a session sprite hue by display name (otherwise each name picks one).
# sprite_overrides = { "build" = "#3b82f6" }

# Which features load, in nav order (leave out for all of them)
# features = "sessions,files,asks,chat,mail,comms,voicelab,push"

# Where your sessions live and where the app keeps its own files
# claude_home = "~/.claude"
# codex_home = "~/.codex"      # optional: show Codex plan limits from local rollout logs
# claude_limits = false        # never send your Claude Code login token to Anthropic for your limit use
# data_dir = "~/.local/share/agent-companion"
# push_dir = "~/.local/share/agent-companion"   # the push key and the subscribed devices (default data_dir)
# mergeq_land = "pr"     # the merge queue: "pr" (a pull request per branch) or "local" (fast-forward and push)
# mergeq_base = "main"   # the branch the merge queue lands on
# clear_over_file = "~/.local/share/agent-companion/needs-clear.json"  # who is past the /clear line, for a prompt hook to read

# Scoreboard: days in which a later commit can count as rework. It reads only
# projects listed below and keeps its cache and owner marks in data_dir.
# score_window_days = 7

# Shared deferred work and cross-project handoffs.  The default file is
# deferred.md in data_dir.  Entries added from the dashboard use this label.
# deferred_file = "~/.local/share/agent-companion/deferred.md"
# deferred_by = "owner"

# Restore snapshots: saved every five minutes by the optional user timer.
# restore_snapshot_interval_min = 5
# systemd_user_dir = "~/.config/systemd/user"
# restore_python = "/path/to/your/venv/bin/python3"

# A stuck ask (unanswered this long, while you are awake) alerts once
# ring_after_min = 30
# ring_gap_min = 10
# ring_day_max = 8

# A top-level session at this many context tokens says "needs /clear".
# clear_line = 400000

# Local Machine tab: `/` is always shown. Add mounted paths when useful on
# your system, for example a Windows drive from WSL. Pushes are off by default.
# health_disks = ["/mnt/c"]
# health_hot_c = 85
# health_disk_full_pct = 90
# health_mem_full_pct = 92
# health_push = false

# The job reaper is off until job_reaper_every_min is set. Then the server
# terminates an orphaned run_in_background shell past job_reaper_after_min, so
# name anything meant to keep running (a dev server) in job_reaper_keep below.
# job_reaper_every_min = 10
# job_reaper_after_min = 60
# A job under a live session is left alone unless this is set; then it is
# reaped past this many hours too (a forgotten `until ...; do sleep 5; done`).
# job_reaper_max_hours = 6
# Commands never reaped: a regular expression, matched without regard to case.
# Single quotes make it a TOML literal string, so backslashes stay as written.
# job_reaper_keep = '# keep-running|\bhttp\.server\b|\buvicorn\b|\bnpm\s+run\s+dev\b|\btail\s+-f\b'
# One pass from a timer of your own instead: python3 -m agent_companion.jobreaper
# (--dry-run lists what it would stop and signals nothing).

# Notes between two people's Claudes on a shared repo (COLLAB.md)
# collab_label = "for-alex"        # your label: notes filed for you
# collab_from = "sam-github-login" # whose notes your sessions are shown (comma separated); empty shows none
# collab_repo = "example/app"      # defaults to this repo's origin

# Fitness tab (docs/fitness-sources.md)
# fitness_source = "demo"            # "home_assistant" or "demo"; empty = no fitness source set up
# units = "imperial"                 # or "metric" (default)
# fitness_sleep_goal_min = 420
# fitness_work_days = "mon,tue,wed,thu,fri"   # mornings you get up for work; leave out for no split
# ha_url = "http://ha.example.com:8123"
# ha_token_file = "~/.config/agent-companion/ha-token"   # a 600 file; never the token itself
# fitness_sleep_entity = "sensor.example_sleep_minutes_asleep"
# fitness_hr_entity = "sensor.example_resting_heart_rate"
# fitness_steps_entity = "sensor.example_daily_steps"
# fitness_distance_entity = "sensor.example_daily_distance"
# fitness_weight_entity = "sensor.example_weight"

# Your own plug-in module (optional): who else may use shared pages, what
# happens when an ask is made or answered, whether you are asleep, extra
# private places, and the voice lab's "right now" line, a voice's notes and
# what follows a build you want. See CHANGES.md.
# addons = "my_addons"

# Voice lab: a part-done build shows as running while it moved within this
# many minutes (default 15), and a build's scores.json tags the live voice's
# own takes, its baseline, with one of these (default ["live"]).
# voicelab_running_minutes = 360
# voicelab_baseline_tags = ["live"]

# Projects never read aloud or sent to an outside voice service
# private_projects = ["ledger"]

# Spoken question and approval lines for your own cast, by speaker name.
# {you} becomes `name`. Question lines are sentences; approval lines are
# fragments the tool name is added to. Tables go last in this file.
# [question_lines]
# Alex = ["{you}, got a question.", "Question for you, {you}.", "{you}. Need an answer."]
# [approval_lines]
# Alex = ["{you}, need your OK"]

# How the pages name a voice host from remote-hosts.conf where its bare name
# reads wrong: a host on this server's own machine, say, whose bare name could
# read as the dashboard itself being down. One table per host.
# [voice_host_names.local]
# subject = "the voice host on this PC"
# possessive = "this PC's"
# place = "this PC"

# Where Files and Specs find checkouts: the child folders of each folder
# listed here (a folder of repositories and the folder its git worktrees go
# in, say); a listed folder is never itself a checkout. Leave it out and the
# [projects] folders below are the checkouts. A repository's worktrees show
# under it, its main checkout first, else a name in checkout_prefer; names in
# checkout_skip are never shown or read.
# checkout_dirs = ["~/work", "~/work/worktrees"]
# checkout_skip = ["old-clone"]
# checkout_prefer = ["api-main"]

# More folders of design documents for Specs, by name, listed as kind "docs".
# A session working in a folder's parent counts as working on it.
# spec_folders = {notes = "~/notes/docs"}

# Who a Files save commits as (a repository's own user.email still wins);
# leave them out to commit as git's own identity. Every save is a line in
# files_log (default <data_dir>/files.jsonl), and the spec push remembers what
# it announced in specs_seen_file (default <data_dir>/specs-seen.json).
# files_author_name = "Ada"
# files_author_email = "ada@example.com"

# The project folders the dashboard may act in: New session starts Claude
# only in these, and without checkout_dirs, Files and Specs show these.
# [projects]
# api = "~/work/api"
# site = "~/work/site"
# Or as rows, which may also give New session a key (what the page sends),
# a label and a tmux session prefix; each defaults to the name:
# [[projects]]
# name = "site"
# path = "~/work/site"
# label = "Web site"
# prefix = "claude-site"

# New session: the model a new Claude starts with (leave out for the default),
# and words every start passes to claude, such as a permission mode.
# (An older [new_session] projects = [...] list is still read.)
# [new_session]
# default_model = "sonnet"
# claude_args = ["--permission-mode", "acceptEdits"]
#
# Other ways to start, offered on the sheet as "Start with". `program` runs in
# place of claude (one word, no shell; it must exec claude, for example a
# script that points Claude Code at another provider), with its own model.
# [[new_session.launchers]]
# key = "other"
# label = "Other provider"
# program = "~/bin/claude-other"
# model = "provider/model-name"
